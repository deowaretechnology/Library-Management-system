name: Build Android APK

# Builds the Capacitor Android app (android/) into a real, installable .apk.
#
# This runs on GitHub's own build machines — not in any local sandbox — because
# a full Android build needs the Android SDK + Google's Maven repo, which some
# restricted environments (like Claude's cloud sandbox) cannot reach. GitHub
# Actions runners have normal internet access, so the build always succeeds here
# even when it can't be done locally.
#
# The app itself is just a WebView shell pointed at the live site
# (see capacitor.config.ts) — this workflow does not need any app secrets,
# it only needs to compile the shell.

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "capacitor.config.ts"
      - "public/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      # android/capacitor-cordova-android-plugins is a generated glue folder
      # (gitignored, like node_modules) that Capacitor rebuilds from
      # package.json — it has to be regenerated here before Gradle runs,
      # the same as any normal Capacitor CI pipeline.
      - name: Capacitor sync
        id: cap_sync
        continue-on-error: true
        run: npx cap sync android 2>&1 | tee /tmp/cap-sync.log

      - name: Report Capacitor sync failure
        if: steps.cap_sync.outcome == 'failure'
        run: |
          TAIL=$(tail -n 60 /tmp/cap-sync.log | sed ':a;N;$!ba;s/\n/%0A/g' | head -c 6000)
          echo "::error::npx cap sync failed. Log tail:%0A$TAIL"
          exit 1

      - name: Debug - check cordova plugins folder
        run: |
          OUT=$(ls -la android/capacitor-cordova-android-plugins 2>&1; echo "---find---"; find android -iname "cordova.variables.gradle" 2>&1; echo "---settings.gradle---"; cat android/settings.gradle 2>&1)
          ENC=$(echo "$OUT" | sed ':a;N;$!ba;s/\n/%0A/g' | head -c 4000)
          echo "::warning::Cordova plugins folder state:%0A$ENC"

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      # Install the Android SDK ourselves rather than relying on a third-party
      # action or whatever happens to be preinstalled on the runner image —
      # this is the same manual method Google's own CI docs use, so it
      # doesn't depend on runner-image contents that change over time.
      - name: Set up Android SDK
        run: |
          set -e
          export ANDROID_SDK_ROOT="$HOME/android-sdk"
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          curl -sSL -o /tmp/cmdline-tools.zip "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          unzip -q /tmp/cmdline-tools.zip -d "$ANDROID_SDK_ROOT/cmdline-tools"
          mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Install required SDK platform & build-tools
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Build debug APK
        id: gradle_build
        working-directory: android
        continue-on-error: true
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/gradle-build.log

      # The normal Actions log viewer needs an interactive GitHub login, which
      # isn't available everywhere this workflow might be debugged from, so on
      # failure also surface the real error as a ::error:: annotation — those
      # are readable straight from the API, no login needed.
      - name: Report Gradle failure
        if: steps.gradle_build.outcome == 'failure'
        run: |
          TAIL=$(tail -n 60 /tmp/gradle-build.log | sed ':a;N;$!ba;s/\n/%0A/g' | head -c 6000)
          echo "::error::Gradle build failed. Log tail:%0A$TAIL"
          exit 1

      - name: Locate APK
        id: apk
        run: |
          APK_PATH=$(find android/app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"
          cp "$APK_PATH" college-library-debug.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: college-library-debug-apk
          path: college-library-debug.apk

      - name: Publish/update "latest APK" release
        uses: ncipollo/release-action@v1
        with:
          tag: android-apk-latest
          name: College Library — latest Android APK
          body: |
            Auto-built from the latest `main` branch by GitHub Actions.
            This is a debug build (self-signed, installs fine for demo/testing —
            Android may show an "unknown source" warning on install, which is
            normal for a debug APK).

            Commit: ${{ github.sha }}
          artifacts: college-library-debug.apk
          allowUpdates: true
          replacesArtifacts: true
          makeLatest: true
          token: ${{ secrets.GITHUB_TOKEN }}
