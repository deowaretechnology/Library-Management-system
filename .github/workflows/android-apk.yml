name: Build Android APK

# Builds the Capacitor Android app (android/) into a real, installable .apk.
#
# This runs on GitHub's own build machines — not in any local sandbox — because
# a full Android build needs the Android SDK + Google's Maven repo, which some
# restricted environments (like Claude's cloud sandbox) cannot reach. GitHub
# Actions runners have normal internet access, so the build always succeeds here
# even when it can't be done locally.
#
# The app itself is just a WebView shell pointed at the live site
# (see capacitor.config.ts) — this workflow does not need any app secrets,
# it only needs to compile the shell.

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "capacitor.config.ts"
      - "public/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      # Install the Android SDK ourselves rather than relying on a third-party
      # action or whatever happens to be preinstalled on the runner image —
      # this is the same manual method Google's own CI docs use, so it
      # doesn't depend on runner-image contents that change over time.
      - name: Set up Android SDK
        run: |
          set -e
          export ANDROID_SDK_ROOT="$HOME/android-sdk"
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          curl -sSL -o /tmp/cmdline-tools.zip "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          unzip -q /tmp/cmdline-tools.zip -d "$ANDROID_SDK_ROOT/cmdline-tools"
          mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Install required SDK platform & build-tools
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/gradle-build.log

      # This repo's normal log viewer (Actions UI) needs an interactive GitHub
      # login and isn't reachable from every environment that might be
      # debugging this workflow, so on failure also commit the tail of the
      # build log to a throwaway branch — a plain `git fetch` is enough to
      # read it back from anywhere with repo access.
      - name: Save build log on failure
        if: failure()
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git fetch origin main
          git checkout -B ci-debug-log origin/main
          mkdir -p .ci-logs
          tail -n 500 /tmp/gradle-build.log > .ci-logs/gradle-build.log
          git add .ci-logs/gradle-build.log
          git commit -m "CI debug log for ${{ github.sha }}"
          git push origin ci-debug-log --force

      - name: Locate APK
        id: apk
        run: |
          APK_PATH=$(find android/app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"
          cp "$APK_PATH" college-library-debug.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: college-library-debug-apk
          path: college-library-debug.apk

      - name: Publish/update "latest APK" release
        uses: ncipollo/release-action@v1
        with:
          tag: android-apk-latest
          name: College Library — latest Android APK
          body: |
            Auto-built from the latest `main` branch by GitHub Actions.
            This is a debug build (self-signed, installs fine for demo/testing —
            Android may show an "unknown source" warning on install, which is
            normal for a debug APK).

            Commit: ${{ github.sha }}
          artifacts: college-library-debug.apk
          allowUpdates: true
          replacesArtifacts: true
          makeLatest: true
          token: ${{ secrets.GITHUB_TOKEN }}
